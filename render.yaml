# Render Blueprint for the Majeure API. Deploy: render.com -> New -> Blueprint -> this repo.
# The React frontend deploys separately on Vercel (Root Directory = frontend/, see frontend/README.md).
services:
  - type: web
    name: majeure-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Optional — only needed for the "Ask Majeure" chat tab. Without these it degrades
      # gracefully (the tab shows "Nemotron is not reachable"); every other endpoint (KPIs,
      # map, shipments, decisions, events, traffic, backtest, signals) reads pre-computed data
      # from data/majeure.db and needs no LLM call at request time.
      - key: NEMOTRON_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NEMOTRON_API_KEY
        sync: false
      - key: NEMOTRON_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Protects POST /api/pipeline/run (the external-cron data-refresh trigger, see
      # backend/app/main.py) from being called by anyone else who finds the URL. Render
      # generates a random value on first deploy — copy it from this service's Environment
      # tab into the cron job's URL as ?token=<value>.
      - key: PIPELINE_TRIGGER_TOKEN
        generateValue: true
      # "rules" needs no reachable LLM, so scheduled runs keep producing decisions even
      # without NEMOTRON_API_KEY/GEMINI_API_KEY set. Change to "nemotron" once one of those
      # is configured and you want cited, model-reasoned decisions instead.
      - key: PIPELINE_ENGINE
        value: rules
      # Postgres (Supabase) instead of the committed SQLite snapshot. Without this the service
      # still runs, but a redeploy silently discards every ingested signal and every human
      # approval since the last commit -- see src/store.py.
      - key: DB_BACKEND
        value: postgres
      # Supabase Session pooler URL, set in the dashboard (never committed). See .env.example.
      - key: DATABASE_URL
        sync: false
      # Sending approved notices. Without RESEND_API_KEY the Send button stays disabled and the
      # service says so, rather than pretending a notice was served.
      - key: RESEND_API_KEY
        sync: false
      - key: NOTICE_FROM
        sync: false
      - key: NOTICE_RECIPIENT
        sync: false
